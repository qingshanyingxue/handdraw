<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>手势控制粒子特效</title>
    <style>
      body {
        margin: 0;
        overflow: hidden;
        background-color: #000;
      }
      canvas {
        display: block;
      }
      /* 隐藏原始摄像头视频流，只显示渲染的特效 */
      #videoElement {
        display: none;
      }
      #loading {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        color: #00ffff;
        font-family: sans-serif;
        font-size: 20px;
        text-shadow: 0 0 10px #00ffff;
      }
      #tip {
        position: absolute;
        top: 20px;
        left: 20px;
        color: rgba(255, 255, 255, 0.7);
        font-family: sans-serif;
      }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <div id="loading">正在加载 AI 模型并请求摄像头权限...</div>
    <div id="tip">
      手势提示：<br />✋ 手掌平移：旋转星体<br />🤏 食指与拇指开合：缩放星体<br />✊
      握拳：坍缩粒子
    </div>
    <video id="videoElement" autoplay playsinline></video>

    <script>
      // ================= 1. Three.js 3D 粒子系统初始化 =================
      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(
        75,
        window.innerWidth / window.innerHeight,
        0.1,
        1000,
      );
      const renderer = new THREE.WebGLRenderer({
        antialias: true,
        alpha: true,
      });
      renderer.setSize(window.innerWidth, window.innerHeight);
      document.body.appendChild(renderer.domElement);

      // 创建粒子几何体
      const particlesGeometry = new THREE.BufferGeometry();
      const particlesCount = 15000; // 粒子数量
      const posArray = new Float32Array(particlesCount * 3);
      const originalPosArray = new Float32Array(particlesCount * 3);

      // 生成球体分布的粒子
      for (let i = 0; i < particlesCount * 3; i += 3) {
        const r = 3 * Math.cbrt(Math.random()); // 球体半径
        const theta = Math.random() * 2 * Math.PI;
        const phi = Math.acos(2 * Math.random() - 1);

        const x = r * Math.sin(phi) * Math.cos(theta);
        const y = r * Math.sin(phi) * Math.sin(theta);
        const z = r * Math.cos(phi);

        posArray[i] = x;
        posArray[i + 1] = y;
        posArray[i + 2] = z;
        originalPosArray[i] = x;
        originalPosArray[i + 1] = y;
        originalPosArray[i + 2] = z;
      }

      particlesGeometry.setAttribute(
        "position",
        new THREE.BufferAttribute(posArray, 3),
      );

      // 粒子材质（类似全息青蓝色）
      const particlesMaterial = new THREE.PointsMaterial({
        size: 0.025,
        color: 0x00ffff,
        transparent: true,
        opacity: 0.8,
        blending: THREE.AdditiveBlending, // 叠加发光效果
      });

      const particlesMesh = new THREE.Points(
        particlesGeometry,
        particlesMaterial,
      );
      scene.add(particlesMesh);
      camera.position.z = 7;

      // ================= 2. 交互逻辑与动画循环 =================
      let targetRotationX = 0;
      let targetRotationY = 0;
      let targetScale = 1;
      let isFist = false;

      function animate() {
        requestAnimationFrame(animate);

        // 基础自转
        particlesMesh.rotation.y += 0.002;

        // 平滑插值：让手势控制更平滑，不生硬
        particlesMesh.rotation.x +=
          (targetRotationX - particlesMesh.rotation.x) * 0.1;
        particlesMesh.rotation.y +=
          (targetRotationY - particlesMesh.rotation.y) * 0.1;

        particlesMesh.scale.set(
          particlesMesh.scale.x + (targetScale - particlesMesh.scale.x) * 0.1,
          particlesMesh.scale.y + (targetScale - particlesMesh.scale.y) * 0.1,
          particlesMesh.scale.z + (targetScale - particlesMesh.scale.z) * 0.1,
        );

        // 握拳效果：让粒子向中心坍缩
        const positions = particlesGeometry.attributes.position.array;
        for (let i = 0; i < positions.length; i += 3) {
          if (isFist) {
            positions[i] *= 0.9;
            positions[i + 1] *= 0.9;
            positions[i + 2] *= 0.9;
          } else {
            // 松开手后缓慢恢复原状
            positions[i] += (originalPosArray[i] - positions[i]) * 0.08;
            positions[i + 1] +=
              (originalPosArray[i + 1] - positions[i + 1]) * 0.08;
            positions[i + 2] +=
              (originalPosArray[i + 2] - positions[i + 2]) * 0.08;
          }
        }
        particlesGeometry.attributes.position.needsUpdate = true;

        renderer.render(scene, camera);
      }
      animate();

      // 窗口缩放适配
      window.addEventListener("resize", () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      // ================= 3. MediaPipe 手势识别接入 =================
      const videoElement = document.getElementById("videoElement");
      const loadingElement = document.getElementById("loading");

      // 处理识别结果
      function onResults(results) {
        if (loadingElement) loadingElement.style.display = "none";

        if (
          results.multiHandLandmarks &&
          results.multiHandLandmarks.length > 0
        ) {
          const landmarks = results.multiHandLandmarks[0]; // 获取第一只手的数据

          // 1. 追踪手掌位置控制旋转 (使用手腕坐标点 0)
          const palmX = landmarks[0].x;
          const palmY = landmarks[0].y;
          targetRotationY = (palmX - 0.5) * Math.PI * 3; // 映射到旋转角度
          targetRotationX = (palmY - 0.5) * Math.PI * 3;

          // 2. 捏合检测控制缩放 (食指尖[8]与拇指尖[4]的距离)
          const thumbTip = landmarks[4];
          const indexTip = landmarks[8];
          const distance = Math.sqrt(
            Math.pow(thumbTip.x - indexTip.x, 2) +
              Math.pow(thumbTip.y - indexTip.y, 2),
          );
          // 将距离映射到缩放比例
          targetScale = Math.max(0.1, distance * 6);

          // 3. 简单的握拳检测 (中指尖[12]是否低于中指根部[9])
          const middleTipY = landmarks[12].y;
          const middleMcpY = landmarks[9].y;
          isFist = middleTipY > middleMcpY;
        } else {
          // 没检测到手时，缓慢恢复默认状态
          targetRotationX = 0;
          targetScale = 1;
          isFist = false;
        }
      }

      // 初始化 MediaPipe
      const hands = new Hands({
        locateFile: (file) => {
          return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
        },
      });

      hands.setOptions({
        maxNumHands: 1, // 只识别一只手
        modelComplexity: 1,
        minDetectionConfidence: 0.7,
        minTrackingConfidence: 0.7,
      });

      hands.onResults(onResults);

      // 启动摄像头
      const cameraFeed = new Camera(videoElement, {
        onFrame: async () => {
          await hands.send({ image: videoElement });
        },
        width: 640,
        height: 480,
      });
      cameraFeed.start();
    </script>
  </body>
</html>
