<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>完美视角对齐：手势控制粒子特效</title>
    <style>
      body {
        margin: 0;
        overflow: hidden;
        background-color: #050505;
        font-family: sans-serif;
      }
      canvas {
        display: block;
      }
      #videoElement {
        display: none;
      }
      #loading {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        color: #fff;
        font-size: 18px;
        letter-spacing: 2px;
      }
      #ui-panel {
        position: absolute;
        top: 20px;
        left: 20px;
        color: rgba(255, 255, 255, 0.9);
        background: rgba(0, 0, 0, 0.6);
        padding: 15px;
        border-radius: 10px;
        border: 1px solid rgba(255, 255, 255, 0.2);
        backdrop-filter: blur(5px);
        user-select: none;
      }
      .color-picker {
        margin-bottom: 10px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }
      input[type="color"] {
        border: none;
        width: 30px;
        height: 30px;
        border-radius: 5px;
        cursor: pointer;
        background: none;
      }
      .tips {
        margin-top: 15px;
        line-height: 1.8;
        font-size: 14px;
        color: #ccc;
      }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <div id="loading">正在初始化环境，请允许调用摄像头...</div>

    <div id="ui-panel">
      <div class="color-picker">
        <span>内层粒子颜色:</span>
        <input type="color" id="innerColorPicker" value="#00ffff" />
      </div>
      <div class="color-picker">
        <span>外层粒子颜色:</span>
        <input type="color" id="outerColorPicker" value="#ff00ff" />
      </div>
      <div class="tips">
        <b>🪄 魔法手势指南：</b><br />
        ☝️ <b>单指平移</b>：第一视角上下左右旋转<br />
        ✌️ <b>双指旋转</b>：第一视角顺/逆时针自转<br />
        🖐️ <b>手掌缩放</b>：大拇指与小拇指张开控制大小<br />
        ✊ <b>握拳收缩</b>：外层坍缩至内层，内层膨胀
      </div>
    </div>

    <video id="videoElement" autoplay playsinline></video>

    <script>
      // ================= 1. Three.js 初始化 =================
      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(
        60,
        window.innerWidth / window.innerHeight,
        0.1,
        1000,
      );
      camera.position.z = 10;
      const renderer = new THREE.WebGLRenderer({
        antialias: true,
        alpha: true,
      });
      renderer.setSize(window.innerWidth, window.innerHeight);
      document.body.appendChild(renderer.domElement);

      const sphereGroup = new THREE.Group();
      scene.add(sphereGroup);

      const CONFIG = {
        innerRadius: 2.0,
        outerRadius: 3.5,
        innerCount: 20000,
        outerCount: 4000,
      };

      function createParticleSphere(count, radius, colorHex) {
        const geometry = new THREE.BufferGeometry();
        const positions = new Float32Array(count * 3);
        const originalPositions = new Float32Array(count * 3);

        for (let i = 0; i < count * 3; i += 3) {
          const phi = Math.acos(1 - 2 * Math.random());
          const theta = Math.random() * 2 * Math.PI;
          const x = radius * Math.sin(phi) * Math.cos(theta);
          const y = radius * Math.sin(phi) * Math.sin(theta);
          const z = radius * Math.cos(phi);

          positions[i] = x;
          positions[i + 1] = y;
          positions[i + 2] = z;
          originalPositions[i] = x;
          originalPositions[i + 1] = y;
          originalPositions[i + 2] = z;
        }

        geometry.setAttribute(
          "position",
          new THREE.BufferAttribute(positions, 3),
        );
        geometry.setAttribute(
          "originalPosition",
          new THREE.BufferAttribute(originalPositions, 3),
        );

        const material = new THREE.PointsMaterial({
          size: 0.03,
          color: colorHex,
          transparent: true,
          opacity: 0.8,
          blending: THREE.AdditiveBlending,
        });

        return new THREE.Points(geometry, material);
      }

      const innerSphere = createParticleSphere(
        CONFIG.innerCount,
        CONFIG.innerRadius,
        0x00ffff,
      );
      const outerSphere = createParticleSphere(
        CONFIG.outerCount,
        CONFIG.outerRadius,
        0xff00ff,
      );
      sphereGroup.add(innerSphere);
      sphereGroup.add(outerSphere);

      // ================= UI 颜色事件 =================
      document
        .getElementById("innerColorPicker")
        .addEventListener("input", (e) => {
          innerSphere.material.color.setStyle(e.target.value);
        });
      document
        .getElementById("outerColorPicker")
        .addEventListener("input", (e) => {
          outerSphere.material.color.setStyle(e.target.value);
        });

      // ================= 2. 核心状态：使用四元数替代欧拉角 =================
      // 目标旋转状态（用四元数记录，避免 Gimbal Lock 和轴偏移问题）
      const targetQuaternion = new THREE.Quaternion();
      const tempQuaternion = new THREE.Quaternion(); // 临时计算用

      let targetGlobalScale = 1.0;
      let isFist = false;

      function animate() {
        requestAnimationFrame(animate);

        // 1. 让目标状态自身带有轻微的持续自转（显得有生命力），始终绕世界坐标的 Y 轴
        tempQuaternion.setFromAxisAngle(new THREE.Vector3(0, 1, 0), 0.001);
        targetQuaternion.premultiply(tempQuaternion);

        // 2. 将物体的当前旋转，平滑插值（slerp）到目标旋转状态
        sphereGroup.quaternion.slerp(targetQuaternion, 0.1);

        // 3. 平滑缩放
        sphereGroup.scale.lerp(
          new THREE.Vector3(
            targetGlobalScale,
            targetGlobalScale,
            targetGlobalScale,
          ),
          0.1,
        );

        // 4. 握拳内层膨胀
        const innerTargetScale = isFist ? 1.3 : 1.0;
        innerSphere.scale.lerp(
          new THREE.Vector3(
            innerTargetScale,
            innerTargetScale,
            innerTargetScale,
          ),
          0.1,
        );

        // 5. 握拳外层收缩逻辑
        const outerPositions = outerSphere.geometry.attributes.position.array;
        const outerOriginals =
          outerSphere.geometry.attributes.originalPosition.array;
        const shrinkRatio = CONFIG.innerRadius / CONFIG.outerRadius;

        for (let i = 0; i < outerPositions.length; i += 3) {
          const targetX = isFist
            ? outerOriginals[i] * shrinkRatio
            : outerOriginals[i];
          const targetY = isFist
            ? outerOriginals[i + 1] * shrinkRatio
            : outerOriginals[i + 1];
          const targetZ = isFist
            ? outerOriginals[i + 2] * shrinkRatio
            : outerOriginals[i + 2];

          const lerpFactor = isFist ? 0.15 : 0.05;
          outerPositions[i] += (targetX - outerPositions[i]) * lerpFactor;
          outerPositions[i + 1] +=
            (targetY - outerPositions[i + 1]) * lerpFactor;
          outerPositions[i + 2] +=
            (targetZ - outerPositions[i + 2]) * lerpFactor;
        }
        outerSphere.geometry.attributes.position.needsUpdate = true;

        renderer.render(scene, camera);
      }
      animate();

      // ================= 3. MediaPipe 视觉识别与逻辑映射 =================
      const videoElement = document.getElementById("videoElement");
      let previousFingerX = null;
      let previousFingerY = null;
      let previousAngle = null;

      function onResults(results) {
        document.getElementById("loading").style.display = "none";

        if (
          results.multiHandLandmarks &&
          results.multiHandLandmarks.length > 0
        ) {
          const landmarks = results.multiHandLandmarks[0];

          const isIndexExtended = landmarks[8].y < landmarks[6].y;
          const isMiddleExtended = landmarks[12].y < landmarks[10].y;
          const isRingExtended = landmarks[16].y < landmarks[14].y;
          const isPinkyExtended = landmarks[20].y < landmarks[18].y;

          const extendedFingers = [
            isIndexExtended,
            isMiddleExtended,
            isRingExtended,
            isPinkyExtended,
          ].filter(Boolean).length;

          if (extendedFingers === 0) {
            // 【状态：握拳】
            isFist = true;
            resetTracking();
          } else if (extendedFingers >= 4) {
            // 【状态：手掌张开】
            isFist = false;
            resetTracking();

            const thumb = landmarks[4];
            const pinky = landmarks[20];
            const handSpan = Math.hypot(pinky.x - thumb.x, pinky.y - thumb.y);
            targetGlobalScale = Math.max(0.5, Math.min(2.5, handSpan * 3.5));
          } else if (extendedFingers === 1 && isIndexExtended) {
            // 【状态：单指滑动】
            isFist = false;
            previousAngle = null;
            const currentX = landmarks[8].x;
            const currentY = landmarks[8].y;

            if (previousFingerX !== null && previousFingerY !== null) {
              const deltaX = currentX - previousFingerX;
              const deltaY = currentY - previousFingerY;

              // 重点修复：始终围绕屏幕空间（世界空间）的轴旋转
              // 绕 Y 轴旋转（左右）
              tempQuaternion.setFromAxisAngle(
                new THREE.Vector3(0, 1, 0),
                deltaX * 5,
              );
              targetQuaternion.premultiply(tempQuaternion);

              // 绕 X 轴旋转（上下）
              tempQuaternion.setFromAxisAngle(
                new THREE.Vector3(1, 0, 0),
                deltaY * 5,
              );
              targetQuaternion.premultiply(tempQuaternion);
            }
            previousFingerX = currentX;
            previousFingerY = currentY;
          } else if (
            extendedFingers === 2 &&
            isIndexExtended &&
            isMiddleExtended
          ) {
            // 【状态：双指旋转】
            isFist = false;
            previousFingerX = null;
            previousFingerY = null;

            const indexTip = landmarks[8];
            const middleTip = landmarks[12];
            const angle = Math.atan2(
              middleTip.y - indexTip.y,
              middleTip.x - indexTip.x,
            );

            if (previousAngle !== null) {
              let deltaAngle = angle - previousAngle;

              // 连贯性修复：处理 180 度到 -180 度的临界跳变，保持转动连贯
              while (deltaAngle > Math.PI) deltaAngle -= 2 * Math.PI;
              while (deltaAngle < -Math.PI) deltaAngle += 2 * Math.PI;

              // 重点修复：始终围绕屏幕的 Z 轴（指向你的方向）进行旋转
              tempQuaternion.setFromAxisAngle(
                new THREE.Vector3(0, 0, 1),
                deltaAngle * 2.0,
              );
              targetQuaternion.premultiply(tempQuaternion);
            }
            previousAngle = angle;
          } else {
            resetTracking();
          }
        } else {
          resetTracking();
          targetGlobalScale += (1.0 - targetGlobalScale) * 0.05;
        }
      }

      function resetTracking() {
        previousFingerX = null;
        previousFingerY = null;
        previousAngle = null;
      }

      const hands = new Hands({
        locateFile: (file) =>
          `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`,
      });
      hands.setOptions({
        maxNumHands: 1,
        modelComplexity: 1,
        minDetectionConfidence: 0.7,
        minTrackingConfidence: 0.7,
      });
      hands.onResults(onResults);

      const cameraFeed = new Camera(videoElement, {
        onFrame: async () => {
          await hands.send({ image: videoElement });
        },
        width: 640,
        height: 480,
      });
      cameraFeed.start();

      window.addEventListener("resize", () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
    </script>
  </body>
</html>
